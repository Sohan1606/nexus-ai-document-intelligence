services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      NEXUS_DATA_DIR: /data
      NEXUS_CORPUS_DIR: /app/corpus
      NEXUS_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - nexus-data:/data
    # Ollama is optional and not started here.

  frontend:
    build:
      context: .
      args:
        VITE_API_MODE: local
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  nexus-data:
